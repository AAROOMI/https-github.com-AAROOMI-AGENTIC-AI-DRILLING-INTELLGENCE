    <script>
      // Suppress noisy external browser extension injection errors (MetaMask, Phantom, etc.)
      (function() {
        function isExtensionError(err) {
          if (!err) return false;
          var str = (typeof err === 'string' ? err : '') + ' ' + (err.message || '') + ' ' + (err.stack || '');
          return (
            str.indexOf('MetaMask') !== -1 ||
            str.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
            str.indexOf('Failed to connect to MetaMask') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isExtensionError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.error) || isExtensionError(event.message) || (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
